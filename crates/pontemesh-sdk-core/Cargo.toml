[package]
name = "pontemesh-sdk-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core Rust SDK for Ponte Mesh hybrid content distribution — P2P-accelerated object retrieval with Origin authorization"
keywords = ["cdn", "mesh", "p2p", "sdk", "distribution"]
categories = ["network-programming"]
readme = "../../README.md"

[dependencies]
base64 = "0.22"
hex = "0.4"
libp2p = { version = "0.56", default-features = false, features = ["tcp", "noise", "yamux", "request-response", "cbor", "identify", "ping", "tokio", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
fs2 = "0.4"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
urlencoding = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[features]
default = []
legacy-tcp-dev = []

[dev-dependencies]
