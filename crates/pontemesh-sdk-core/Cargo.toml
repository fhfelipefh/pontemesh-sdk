[package]
name = "pontemesh-sdk-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
urlencoding = "2"

[dev-dependencies]
tempfile = "3"

