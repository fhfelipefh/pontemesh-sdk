[package]
name = "pontemesh-sdk-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
hex = "0.4"
libp2p = { version = "0.54", features = ["tcp", "dns", "tls", "noise", "yamux", "request-response", "cbor", "identify", "ping", "tokio", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
futures = "0.3"
sha2 = "0.10"
thiserror = "2"
urlencoding = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[features]
default = []
legacy-tcp-dev = []

[dev-dependencies]
tempfile = "3"
