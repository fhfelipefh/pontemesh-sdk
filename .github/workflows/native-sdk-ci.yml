name: Native SDK CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-sdk:
    name: Native SDK (${{ matrix.target.name }})
    if: github.actor == github.repository_owner
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: linux-x64
            os: ubuntu-latest
            dynamic_library: libpontemesh_sdk.so
            static_library: libpontemesh_sdk.a
          - name: macos-x64
            os: macos-15-intel
            dynamic_library: libpontemesh_sdk.dylib
            static_library: libpontemesh_sdk.a
          - name: macos-arm64
            os: macos-latest
            dynamic_library: libpontemesh_sdk.dylib
            static_library: libpontemesh_sdk.a
          - name: windows-x64
            os: windows-latest
            dynamic_library: pontemesh_sdk.dll
            static_library: pontemesh_sdk.lib

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy

      - name: Check repository hygiene
        shell: bash
        run: ./scripts/check-no-dead-code.sh

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy dead-code gate
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release
        run: cargo build --workspace --release --locked

      - name: Build C ABI
        run: cargo build -p pontemesh-sdk-c --release --locked

      - name: Verify native libraries
        shell: bash
        run: |
          test -f "target/release/${{ matrix.target.dynamic_library }}"
          test -f "target/release/${{ matrix.target.static_library }}"

      - name: Upload native library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pontemesh-sdk-${{ matrix.target.name }}
          path: |
            target/release/${{ matrix.target.dynamic_library }}
            target/release/${{ matrix.target.static_library }}
          if-no-files-found: error
          retention-days: 7
