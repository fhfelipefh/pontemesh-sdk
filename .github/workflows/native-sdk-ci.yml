name: Native SDK CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native-sdk:
    name: Native SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check repository hygiene
        shell: bash
        run: ./scripts/check-no-dead-code.sh

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy dead-code gate
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --workspace --release

      - name: Build C ABI
        run: cargo build -p pontemesh-sdk-c --release

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: pontemesh-sdk-${{ matrix.os }}
          path: |
            target/release/pontemesh_sdk.dll
            target/release/libpontemesh_sdk.so
            target/release/libpontemesh_sdk.dylib
            target/release/libpontemesh_sdk.a
          if-no-files-found: ignore

